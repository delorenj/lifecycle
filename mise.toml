# mise configuration for Lifecycle
# https://mise.jdx.dev/configuration.html

[env]
_.path = [".mise/scripts", "agents/hermes/pm"]
_.file = [".env"]

# This block will handle the linking of
# agent files to the main AGENTS.md file.
#
# TODO: Ensure this works for all levels of nesting.
# i.e. All linked agent files MUST be siblings at
# any given level of nesting.
#
# NOTE: hooks are an array of [[hooks.enter]] tables (NOT enter = [ ... ]) and
# every  path is single-quoted so it survives a space in the
# project path — mise runs each `script` via `sh -c`.
[[hooks.enter]]
script = "'{{config_root}}/.mise/scripts/link-agentfiles.sh'"
[[hooks.enter]]
script = "op inject -i .env.op > .env"
[[hooks.enter]]
script = "[ -f '{{config_root}}/.mise/scripts/codegraph.sh' ] && '{{config_root}}/.mise/scripts/codegraph.sh' || true"

[[watch_files]]
patterns = ["AGENTS.md"]
task = "link-agentfiles"

[tasks.link-agentfiles]
description = "Symlink all agent files to AGENTS.md"
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh'"

[tasks.hindsight-setup]
description = "Provision this dev's shared project Hindsight key from 1Password into .env (op inject)"
run = "'{{config_root}}/.mise/scripts/hindsight-setup.sh'"

[tasks.lint]
description = "Run Ruff static checks"
run = "uv run ruff check src tests scripts"

[tasks."format:check"]
description = "Verify Ruff formatting"
run = "uv run ruff format --check src tests scripts"

[tasks.typecheck]
description = "Run static type checks"
run = "uv run mypy src"

[tasks.test]
description = "Run deterministic unit and extraction-parity tests"
run = "uv run pytest -m 'not integration'"

[tasks."test:integration"]
description = "Run isolated PostgreSQL and NATS integration tests"
run = "LIFECYCLE_RUN_INTEGRATION=1 uv run pytest -m integration"

[tasks."contracts:verify"]
description = "Verify pinned Bloodbank commit, schemas, and stream topology"
run = "uv run python scripts/verify_bloodbank_contracts.py"

[tasks.check]
description = "Run component validation excluding container integration"
depends = ["lint", "format:check", "typecheck", "test", "contracts:verify"]

[tasks.migrate]
description = "Apply Lifecycle-owned PostgreSQL migrations"
run = "PYTHONPATH=src uv run python -m main migrate"

[tasks.serve]
description = "Run the Lifecycle authority service"
run = "PYTHONPATH=src uv run python -m main serve"

[tasks."image:build"]
description = "Build the production image with immutable source metadata"
run = """
docker build \
  --build-arg SOURCE_REVISION="$(git rev-parse HEAD)" \
  --build-arg SOURCE_CREATED="$(git log -1 --format=%cI)" \
  --tag lifecycle:local .
"""

# >>> mise-versioning >>>  (managed block — do not edit by hand; re-run init to update)
[tasks."version"]
description = "Print the current version (vX.Y.Z)"
run = "'{{config_root}}/.mise/scripts/versioning.sh' current"

[tasks."version:bump"]
description = "Bump patch version: vX.Y.Z -> vX.Y.(Z+1)"
alias = "version:bump-patch"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump patch"

[tasks."version:bump-minor"]
description = "Bump minor version: vX.Y.Z -> vX.(Y+1).0"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump minor"

[tasks."version:bump-major"]
description = "Bump major version: vX.Y.Z -> v(X+1).0.0"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump major"

[tasks."version:check"]
description = "Verify every versioned file is in parity"
run = "'{{config_root}}/.mise/scripts/versioning.sh' check"

[tasks."version:sync"]
description = "Force every versioned file up to the highest version"
run = "'{{config_root}}/.mise/scripts/versioning.sh' sync"
# <<< mise-versioning <<<
